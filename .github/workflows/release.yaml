name: Release

# Publish a full GitHub release whenever main has a manifest version that has
# no release yet. The Marketplace and HACS install from releases. To release,
# bump "version" in manifest.json and push to main.
on:
  push:
    branches:
      - main
    paths:
      - custom_components/sony_receiver_ir/manifest.json
      - .github/workflows/release.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/sony_receiver_ir/manifest.json)
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
